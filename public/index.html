<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="A fast and simple URL shortener"
    >

    <title>URL Shortener</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>


<body>

    <!-- ================================
         HEADER
    ================================= -->

    <header class="hero">

        <h1>URL Shortener</h1>

        <p class="subtitle">
            Turn long links into short, shareable URLs.
        </p>

    </header>


    <!-- ================================
         SHORTENER FORM
    ================================= -->

    <main>

        <form action="/" method="POST">

            <div class="form-group">

                <label for="url">
                    Enter URL
                </label>

                <input
                    type="url"
                    name="url"
                    id="url"
                    placeholder="https://example.com/very-long-url"
                    autocomplete="url"
                    required
                >

            </div>


            <div class="form-group">

                <label for="shortCode">
                    Enter Short Code
                </label>

                <input
                    type="text"
                    name="shortCode"
                    id="shortCode"
                    placeholder="my-link"
                    autocomplete="off"
                    minlength="3"
                    maxlength="30"
                    pattern="[A-Za-z0-9_-]+"
                    title="Use only letters, numbers, hyphens and underscores."
                >

            </div>


            <button
                type="submit"
                id="submit"
            >

                <span id="button-text">
                    Shorten URL
                </span>

                <span
                    id="button-loader"
                    class="loader"
                    hidden
                ></span>

            </button>

        </form>


        <!-- ================================
             SHORTENED URLS
        ================================= -->

        <section class="links-section">

            <div class="section-heading">

                <h2>
                    Your Shortened URLs
                </h2>

                <span id="link-count">
                    0 links
                </span>

            </div>


            <ul id="links-list">

                {{shortened_urls}}

            </ul>


            

        </section>

    </main>


    <!-- ================================
         JAVASCRIPT
    ================================= -->

    <script>

    </script>

</body>

</html>
